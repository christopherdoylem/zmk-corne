# ---------------------------------------------------------------------------
# Assembled for corne from: shared.conf, oled.conf, board_corne.conf
#
# Do not edit this file. Edit the pieces in universal-keymap/settings/ instead
# -- anything changed here is lost the next time it is assembled.
# ---------------------------------------------------------------------------

# Settings every keyboard gets.
# Edit here, not in the individual keyboard projects -- those files are
# assembled from this one and are overwritten each time.

CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_LOGGING=n

# Added only for keyboards with a screen: corne and the standard klor.

CONFIG_ZMK_DISPLAY=y

# corne only -- its screen shows a custom layout rather than the standard one.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
